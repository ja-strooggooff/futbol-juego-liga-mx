<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexiones · FutTrivia</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span>⚽</span>
        <span>FutTrivia</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Juegos</a>
      </div>
    </div>
  </nav>

  <section class="wordle-page">
    <div class="wordle-header">
      <a href="/" class="back-link">← Volver</a>
      <h1 class="wordle-title">Conexiones</h1>
      <p class="wordle-sub" id="conexiones-sub">Selecciona el grupo completo de jugadores que comparten algo.</p>
      <div class="ft-ligas" id="ft-ligas">
        <a href="?liga=todas" data-liga="todas">Todas</a>
        <a href="?liga=mx" data-liga="mx">Liga MX</a>
        <a href="?liga=argentina" data-liga="argentina">Liga Argentina</a>
      </div>
      <div class="ft-ligas ft-dificultades" id="ft-dificultades">
        <a href="?dificultad=todas" data-dificultad="todas">Todas</a>
        <a href="?dificultad=facil" data-dificultad="facil">Fácil</a>
        <a href="?dificultad=media" data-dificultad="media">Media</a>
        <a href="?dificultad=dificil" data-dificultad="dificil">Difícil</a>
        <a href="?dificultad=legendaria" data-dificultad="legendaria">Legendaria</a>
      </div>
    </div>

    <div id="grupos-resueltos"></div>
    <div class="cx-tablero" id="tablero-conexiones"></div>

    <div class="wordle-input-area">
      <button class="btn-primary" id="btn-probar" onclick="probarGrupo()" disabled>Probar grupo</button>
      <button class="btn-secondary" onclick="deseleccionarTodo()">Limpiar</button>
      <button class="btn-secondary" id="btn-pista" onclick="pedirPista()">Pista</button>
      <button class="btn-secondary" id="reiniciar-btn" onclick="reiniciarPartida()">Reiniciar</button>
    </div>

    <div class="wordle-result hidden" id="result-msg"></div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>⚽ FutTrivia</span>
      <span>Proyecto de verano 2025</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/conexiones.js') }}"></script>
</body>
</html>
