<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexiones · FutTrivia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span>⚽</span>
        <span>FutTrivia</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Juegos</a>
      </div>
    </div>
  </nav>

  <section class="wordle-page">
    <div class="wordle-header">
      <a href="/" class="back-link">← Volver</a>
      <h1 class="wordle-title">Conexiones</h1>
      <p class="wordle-sub">Encuentra los grupos de jugadores que comparten algo en común.</p>
    </div>

    <div id="errores-area" class="conexiones-errores">
      Errores: <span id="errores-count">0</span> / <span id="errores-max">4</span>
    </div>

    <div id="grupos-resueltos"></div>

    <div class="conexiones-tablero" id="tablero"></div>

    <div class="wordle-input-area">
      <button class="btn-primary" id="btn-enviar" onclick="enviarSeleccion()" disabled>Enviar selección</button>
      <button class="btn-secondary" onclick="pedirPista()">Pista</button>
      <button class="btn-secondary" onclick="reiniciarPartida()">Reiniciar</button>
    </div>

    <div class="wordle-result hidden" id="result-msg"></div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>⚽ FutTrivia</span>
      <span>Proyecto de verano 2025</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/conexiones.js') }}"></script>
</body>
</html>
