<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid de Equipos · FutTrivia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span>⚽</span>
        <span>FutTrivia</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Juegos</a>
        <a href="#" class="nav-link nav-cta">Entrar</a>
      </div>
    </div>
  </nav>

  <section class="wordle-page">
    <div class="wordle-header">
      <a href="/" class="back-link">← Volver</a>
      <h1 class="wordle-title">Grid de Equipos</h1>
      <p class="wordle-sub">Encuentra un jugador que cumpla con cada fila y columna.</p>
    </div>

    <table class="grid-table" id="grid-table">
      <thead>
        <tr>
          <th></th>
          <th id="col-0"></th>
          <th id="col-1"></th>
          <th id="col-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th id="row-0"></th>
          <td class="grid-cell" data-fila="0" data-columna="0"></td>
          <td class="grid-cell" data-fila="0" data-columna="1"></td>
          <td class="grid-cell" data-fila="0" data-columna="2"></td>
        </tr>
        <tr>
          <th id="row-1"></th>
          <td class="grid-cell" data-fila="1" data-columna="0"></td>
          <td class="grid-cell" data-fila="1" data-columna="1"></td>
          <td class="grid-cell" data-fila="1" data-columna="2"></td>
        </tr>
        <tr>
          <th id="row-2"></th>
          <td class="grid-cell" data-fila="2" data-columna="0"></td>
          <td class="grid-cell" data-fila="2" data-columna="1"></td>
          <td class="grid-cell" data-fila="2" data-columna="2"></td>
        </tr>
      </tbody>
    </table>

    <div class="wordle-input-area">
      <input
        type="text"
        id="player-input"
        class="wordle-input"
        placeholder="Ej: Lionel Messi"
        autocomplete="off"
      />
      <p id="celda-seleccionada-label" style="color:#888;font-size:14px;margin-bottom:8px;">Selecciona una celda del tablero</p>
      <button class="btn-primary" id="btn-adivinar" onclick="intentarCelda()" disabled>Adivinar</button>
      <button class="btn-secondary" onclick="pedirPista()">Pista</button>
      <button class="btn-secondary" id="reiniciar-btn" onclick="reiniciarPartida()">Reiniciar</button>
    </div>

    <div class="wordle-result hidden" id="result-msg"></div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>⚽ FutTrivia</span>
      <span>Proyecto de verano 2025</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/grid.js') }}"></script>
</body>
</html>
