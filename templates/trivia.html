<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Rápida · FutTrivia</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span>⚽</span>
        <span>FutTrivia</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Juegos</a>
      </div>
    </div>
  </nav>

  <section class="wordle-page">
    <div class="wordle-header">
      <a href="/" class="back-link">← Volver</a>
      <h1 class="wordle-title">Trivia Rápida</h1>
      <p class="wordle-sub" id="trivia-progreso">Cargando pregunta…</p>
      <div class="ft-ligas" id="ft-ligas">
        <a href="?liga=todas" data-liga="todas">Todas</a>
        <a href="?liga=mx" data-liga="mx">Liga MX</a>
        <a href="?liga=argentina" data-liga="argentina">Liga Argentina</a>
      </div>
      <div class="ft-ligas ft-dificultades" id="ft-dificultades">
        <a href="?dificultad=todas" data-dificultad="todas">Todas</a>
        <a href="?dificultad=facil" data-dificultad="facil">Fácil</a>
        <a href="?dificultad=media" data-dificultad="media">Media</a>
        <a href="?dificultad=dificil" data-dificultad="dificil">Difícil</a>
        <a href="?dificultad=legendaria" data-dificultad="legendaria">Legendaria</a>
      </div>
      <div class="ft-ligas ft-dificultades" id="ft-tiempos">
        <a href="?tiempo=30" data-tiempo="30">⏱ 0:30</a>
        <a href="?tiempo=60" data-tiempo="60">1:00</a>
        <a href="?tiempo=90" data-tiempo="90">1:30</a>
        <a href="?tiempo=120" data-tiempo="120">2:00</a>
      </div>
    </div>

    <div class="trivia-tarjeta hidden" id="trivia-tarjeta">
      <div class="trivia-meta">
        <span id="trivia-dificultad" class="trivia-badge"></span>
      </div>
      <h2 class="trivia-pregunta" id="trivia-pregunta"></h2>
      <div class="trivia-opciones" id="trivia-opciones"></div>
    </div>

    <div class="trivia-final hidden" id="trivia-final"></div>

    <div class="wordle-input-area">
      <button class="btn-primary hidden" id="btn-siguiente" onclick="siguientePregunta()">Siguiente</button>
      <button class="btn-secondary" id="btn-pista" onclick="pedirPista()">Pista</button>
      <button class="btn-secondary" id="reiniciar-btn" onclick="reiniciarPartida()">Reiniciar</button>
    </div>

    <div class="wordle-result hidden" id="result-msg"></div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>⚽ FutTrivia</span>
      <span>Proyecto de verano 2025</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/trivia.js') }}"></script>
</body>
</html>
