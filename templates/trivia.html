<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Rápida · FutTrivia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span>⚽</span>
        <span>FutTrivia</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Juegos</a>
      </div>
    </div>
  </nav>

  <section class="wordle-page">
    <div class="wordle-header">
      <a href="/" class="back-link">← Volver</a>
      <h1 class="wordle-title">Trivia Rápida</h1>
      <p class="wordle-sub">Responde todas las preguntas correctamente.</p>
    </div>

    <div class="trivia-progreso">
      Pregunta <span id="num-pregunta">1</span> de <span id="total-preguntas">?</span>
      · Aciertos: <span id="aciertos">0</span>
    </div>

    <div class="trivia-card" id="trivia-card">
      <p class="trivia-pregunta" id="pregunta-texto">Cargando...</p>
      <div class="trivia-opciones" id="opciones"></div>
    </div>

    <div class="wordle-input-area">
      <button class="btn-secondary" onclick="pedirPista()">Pista (elimina 2 opciones)</button>
      <button class="btn-secondary" onclick="reiniciarPartida()">Reiniciar</button>
    </div>

    <div class="wordle-result hidden" id="result-msg"></div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>⚽ FutTrivia</span>
      <span>Proyecto de verano 2025</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/trivia.js') }}"></script>
</body>
</html>
